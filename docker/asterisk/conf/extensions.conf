[general]
static = yes
writeprotect = no
clearglobalvars = no

[default]
exten => _X.,1,NoOp(Default incoming call)
exten => _X.,n,Stasis(VoiceProStasis,${EXTEN})
exten => _X.,n,Hangup()

[from-pstn]
exten => _X.,1,NoOp(PSTN Call to ${EXTEN})
exten => _X.,n,Stasis(VoiceProStasis,${EXTEN})
exten => _X.,n,Hangup()

[stasis-outbound]
exten => _X.,1,NoOp(Stasis Outbound Call to ${EXTEN})
exten => _X.,n,Stasis(VoiceProStasis,${EXTEN})
exten => _X.,n,Hangup()

[from-internal]
exten => _X.,1,NoOp(Call from Client Extension ${CALLERID(num)} to ${EXTEN})
exten => _X.,n,Stasis(VoiceProStasis,${EXTEN})
exten => _X.,n,Hangup()

[test-diag]
exten => _X.,1,NoOp(Diagnostic Dial to ${EXTEN})
same => n,Set(CALLERID(all)="999" <999>)
same => n,Dial(PJSIP/${EXTEN}@bdpbx-999,45,b(test-diag-predial^s^1))
same => n,NoOp(Dial status is ${DIALSTATUS}, cause is ${HANGUPCAUSE})
same => n,Hangup()

[test-diag-predial]
exten => s,1,NoOp(Pre-dial handler on outbound channel)
same => n,Set(PJSIP_HEADER(add,Expires)=60)
same => n,Return()

